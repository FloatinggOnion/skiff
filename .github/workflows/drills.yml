name: failure drills

# Breaks a real panel, router, app and database, then checks what came back. Results are published at /docs/failure-drills.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "e2e/drill_test.go"
      - ".github/workflows/drills.yml"

jobs:
  drills:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: crashes, bucket outage, power cut and full disk
        env:
          SKIFF_DRILLS: machine
        run: go test -tags e2e -count=1 -timeout 40m -v -run '^TestDrill' ./e2e/...
